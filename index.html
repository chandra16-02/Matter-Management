<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var _origFetch = window.fetch;
          var _fetchRef = _origFetch;
          var desc = {
            get: function () {
              return _fetchRef;
            },
            set: function (val) {
              _fetchRef = val;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e) {}
          }
        } catch (err) {}

        window.addEventListener(
          'error',
          function (e) {
            if (
              (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e && e.message && e.message.indexOf('fetch of #<Window>') !== -1)
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (
              e &&
              e.reason &&
              ((typeof e.reason.message === 'string' &&
                e.reason.message.indexOf('fetch of #<Window>') !== -1) ||
                (typeof e.reason.stack === 'string' &&
                  e.reason.stack.indexOf('chrome-extension://') !== -1))
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
